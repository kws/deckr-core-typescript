name: TypeScript Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    env:
      DECKR_SPEC_ROOT: ${{ github.workspace }}/.deckr-spec

    steps:
      - name: Check out implementation
        uses: actions/checkout@v6

      - name: Read specification revision
        id: spec
        run: echo "revision=$(cat .deckr-spec-revision)" >> "$GITHUB_OUTPUT"

      - name: Check out specification
        uses: actions/checkout@v6
        with:
          repository: kws/deckr
          ref: ${{ steps.spec.outputs.revision }}
          path: .deckr-spec
          token: ${{ secrets.DECKR_SPEC_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check, test, and build
        run: npm run check

      - name: Check package contents
        run: npm pack --dry-run
